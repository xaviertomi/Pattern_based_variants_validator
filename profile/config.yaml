executor: cluster-generic
cluster-generic-submit-cmd: >-
  python3 profile/slurm.py submit
  --partition {resources.partition} --account {resources.account}
  --cpus-per-task {threads} --mem {resources.mem_mb} --time {resources.time}
  --job-name motif-{rule} --output logs/jobs/{rule}-%j.out --error logs/jobs/{rule}-%j.err
cluster-generic-status-cmd: "python3 profile/slurm.py status"
cluster-generic-cancel-cmd: "python3 profile/slurm.py cancel"
default-resources:
  partition: "'cpu-dedicated'"
  account: "'dedicated-cpu@cirad-long'"
  mem_mb: 4000
  time: "'01:00:00'"
  disk_mb: 10000
local-cores: 2
jobs: 60
cores: 60
max-jobs-per-timespan: "20/1s"
max-status-checks-per-second: 1
latency-wait: 120
retries: 0
rerun-incomplete: true
printshellcmds: true
scheduler: greedy
