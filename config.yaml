reference_fasta: "/PATH/TO/reference.fasta"
output_dir: "results/motif_pipeline"
scratch_dir: "/PATH/TO/SCRATCH"
pacbio_vcf: "/PATH/TO/pacbio_multisample.vcf.gz"
illumina_vcf: "/PATH/TO/illumina_corresponding_multisample.vcf.gz"
folds:
  grouping:
    enabled: true
    regex: '^chr([0-9]+)(?:_|$)'
    unmatched_policy: "error"
# Each PacBio sample defines a selection group; map its corresponding Illumina samples below.
pacbio_samples: ["PB-library-A", "PB-library-B"]
illumina_corresponding:
  PB-library-A: ["IL-library-A-1", "IL-library-A-2", "IL-library-A-3", "IL-library-A-4", "IL-library-A-5", "IL-library-A-6"]
  PB-library-B: ["IL-library-B-1", "IL-library-B-2", "IL-library-B-3", "IL-library-B-4", "IL-library-B-5"]
other_illumina: "/PATH/TO/other_illumina.vcf.gz"
sample_metadata:
  pacbio: {}
  illumina: {}
  other_illumina: {}
pilot:
  pacbio_sample: "PB-library-A"
  rotation: 1
analysis:
  flank_bp: 50  # Bases on each side of an ALT locus; context windows are 2 * flank + 1 bp.
  center_radius_bp: 10  # Radius around the variant center for the optional central-enrichment check.
  rotations: [1, 2, 3, 4, 5]  # Fixed five-fold scheme: each fold is held out once.
  shuffle_kmer: 3  # K-mer size preserved when generating shuffled control sequences.
  base_seed: 42  # Root seed for deterministic per-sample, rotation, and role seeds.
  seed_overrides: []  # Optional seeds keyed by platform, sample, rotation, and role.
  streme_min_width: 6  # Smallest motif width STREME may discover, in bases.
  streme_max_width: 15  # Largest motif width STREME may discover, in bases.
  streme_total_length: 10000000  # Total input length passed to STREME for significance estimates.
  streme_e_max: 0.05  # Initial PacBio candidates require an STREME E-value below this threshold.
  fimo_p_threshold: 0.0001  # Maximum FIMO occurrence p-value admitted as a hit.
selection:
  # PacBio candidates are checked against their mapped Illumina samples before family matching.
  # Support requires enrichment over controls; a motif hit alone is not enough.
  pacbio_coverage_ratio_min: 1.0
  illumina_coverage_ratio_min: 1.0
  require_all_pacbio_clones: true  # Require every configured group for family and representative validation.
  corresponding_dataset_support_fraction: 1.0  # 1.0 requires all mapped Illumina samples in each group.
  min_supported_rotations: 3  # Proposed unvalidated default, configurable 1-5.
  # Family stability uses this rotation count; exact representatives are tested on their source rotation.
  require_central_enrichment: false
  # Tomtom groups similar matrices; exact representative validation is a separate gate.
  family_matching: {method: "tomtom", q_max: 0.05, min_overlap_bp: 6}
vcf_outputs:
  consensus_fraction: 0.75
  groups: {}
execution:
  use_containers: true
  image_cache: "/PATH/TO/SHARED_IMAGE_CACHE"
  extra_bind_paths: []
  scan_windows_per_shard: 50000
container:
  bcftools: "docker://quay.io/biocontainers/bcftools@sha256:8cf74dd0738e0a86fa3f8dc598596e8160e7e4e71380ab6db943a3b53f993869"
  samtools: "docker://quay.io/biocontainers/samtools@sha256:23cda33a3a42125872766df9aaf1d2db67cdb8c85314b793465188435af31ba6"
  meme: "docker://memesuite/memesuite@sha256:1edcb504a175cf07f1607d1434b691dd0902e320af3b3b3e507a6b800b0cceb5"
  python: "docker://python@sha256:97983fa8cc88343512862c62307159a82261c3528dc025f79e5a3f7af43e50b4"
  r: "docker://rocker/r-ver@sha256:55be3ae296dd21b6f2da705be44804ba7eb2ab2233a7050730506d7e64e8feda"
